<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Our Journey ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fffaf5, #ffe6ee);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    text-align: center;
    padding: 30px 20px;
    -webkit-text-size-adjust: 100%;
}

.container {
    width: 100%;
    max-width: 650px;
}

h1 {
    color: #ff4d88;
    font-size: 32px;
    margin-bottom: 20px;
    line-height: 1.2;
}

.timeline {
    width: 100%;
    margin: 0 auto 25px;
    line-height: 1.8;
    font-size: 16px;
    color: #444;
}

.timeline p {
    margin: 6px 0;
}

.countdown {
    width: 100%;
    max-width: 600px;
    margin: 25px auto;
    padding: 20px 15px;
    border-radius: 20px;
    background: #fff0f5;
    color: #d6336c;
    font-size: 16px;
    font-weight: bold;
}

#timer {
    font-size: 22px;
    margin-top: 10px;
    font-weight: 700;
}

button {
    background: #ff4d88;
    color: #ffffff;
    border: none;
    padding: 14px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 16px;
    width: 100%;
    max-width: 280px;
    transition: background 0.3s, transform 0.2s;
}

button:hover {
    background: #ff2f73;
    transform: scale(1.03);
}

button:active {
    transform: scale(0.98);
}

/* Slightly bigger text on larger screens */
@media (min-width: 480px) {
    h1 {
        font-size: 40px;
    }
    .timeline {
        font-size: 18px;
    }
    .countdown {
        font-size: 18px;
        padding: 22px 18px;
    }
    #timer {
        font-size: 26px;
    }
    button {
        font-size: 18px;
        padding: 16px 22px;
    }
}
</style>
</head>

<body>
<div class="container">

<h1>❤️ Our Journey ❤️</h1>

<div class="timeline">
    <p>💗 Our First Date — 27 November</p>
    <p>📞 Our First Call — 2 December</p>
    <p>💋 Our First kiss — 9 December</p>
    <p>💍 The Day We Got Engaged — 24 December</p>
    <p>❤️ And this is just the beginning...</p>
</div>

<div class="countdown">
    <div>💍 Wedding Countdown</div>
    <div id="timer">Loading...</div>
</div>

<a href="photos.html">
    <button>📸 View Our Memories</button>
</a>

</div>

<script>
const weddingDate = new Date("December 12, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = weddingDate - now;

    if (distance <= 0) {
        document.getElementById("timer").innerHTML = "✨ Today is the wedding day! ✨";
        clearInterval(x);
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("timer").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateCountdown();
const x = setInterval(updateCountdown, 1000);
</script>
</body>
</html>
