<!DOCTYPE html>
<html>
<head>
<title>Our Journey ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: white;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 20px;
}
h1{
    color:#ff4d88;
    font-size:54px;
    margin-bottom:20px;
}
.timeline{
    width:100%;
    max-width:600px;
    margin:auto;
    line-height:2;
    font-size:24px;
}
.countdown{
    width:100%;
    max-width:600px;
    margin:30px auto;
    padding:25px;
    border-radius:20px;
    background:#fff0f5;
    color:#d6336c;
    font-size:24px;
    font-weight:bold;
}
#timer{
    font-size: 30px;
    margin-top: 12px;
}

button{
    background:#ff4d88;
    color:white;
    border:none;
    padding:18px;
    border-radius:30px;
    cursor:pointer;
    font-size:20px;
    margin-top:25px;
    width:300;
}
@media (max-width:768px){

    h1{
        font-size:30px;
    }

    .timeline{
        font-size:18px;
        padding:0 10px;
    }

    .countdown{
        font-size:18px;
        padding:18px;
    }

    #timer{
        font-size:22px;
    }

    button{
        width:100%;
        max-width:280px;
    }

}
.container{
    width:100%;
    max-width:650px;
}
</style>
</head>

<body>
<div class="container">

<h1>❤️ Our Journey ❤️</h1>

<div class="timeline">
    <p>💗 Our First Date — 27 November</p>
    <p>📞 Our First Call — 2 December</p>
    <p>💋 Our First kiss — 9 December</p>
    <p>💍 The Day We Got Engaged — 24 December</p>
    <p>❤️ And this is just the beginning...</p>
</div>

<div class="countdown">
    <div>💍 Wedding Countdown</div>
    <div id="timer">Loading...</div>
</div>

<a href="photos.html">
    <button>📸 View Our Memories</button>
</a>

<script>
const weddingDate = new Date("December 12, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = weddingDate - now;

    if (distance <= 0) {
        document.getElementById("timer").innerHTML = "✨ Today is the wedding day! ✨";
        clearInterval(x);
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("timer").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateCountdown();
const x = setInterval(updateCountdown, 1000);
</script>
</div>
</body>
</html>
