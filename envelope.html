<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Last Surprise ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #fff8f4 0%, #ffe8f0 55%, #ffdbe8 100%);
    font-family: Arial, sans-serif;
    padding: 20px;
    overflow: hidden;
}

.stage {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
}

.hearts {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.heart-float {
    position: absolute;
    bottom: -40px;
    width: 14px;
    height: 14px;
    background: rgba(255, 77, 136, 0.35);
    transform: rotate(45deg);
    border-radius: 2px;
    animation: floatUp linear infinite;
}

.heart-float::before,
.heart-float::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    background: inherit;
    border-radius: 50%;
}

.heart-float::before {
    left: -7px;
    top: 0;
}

.heart-float::after {
    left: 0;
    top: -7px;
}

@keyframes floatUp {
    0% { transform: translateY(0) rotate(45deg) scale(0.8); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-120vh) rotate(45deg) scale(1.3); opacity: 0; }
}

.envelope {
    position: relative;
    width: min(92vw, 340px);
    height: calc(min(92vw, 340px) * 0.72);
    cursor: pointer;
    perspective: 1400px;
    transform-style: preserve-3d;
    filter: drop-shadow(0 20px 30px rgba(255, 77, 136, 0.18));
    transition: transform 0.35s ease, filter 0.35s ease;
}

.envelope:active {
    transform: scale(0.98);
}

.pop {
    animation: pop 0.4s ease;
}

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

.base {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(145deg, #ffd0de 0%, #f7afc2 48%, #ef94ad 100%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55),
        inset 0 -10px 18px rgba(0,0,0,0.07),
        0 14px 30px rgba(0,0,0,0.12);
    overflow: hidden;
}

.base::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(135deg, transparent 49%, rgba(255,255,255,0.28) 50%, transparent 51%),
        linear-gradient(45deg, transparent 49%, rgba(0,0,0,0.05) 50%, transparent 51%);
    opacity: 0.9;
}

.left-tri,
.right-tri,
.bottom-tri {
    position: absolute;
    z-index: 2;
}

.left-tri {
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    border-top: calc((min(92vw, 340px) * 0.72) / 2) solid transparent;
    border-bottom: calc((min(92vw, 340px) * 0.72) / 2) solid transparent;
    border-left: calc(min(92vw, 340px) * 0.5) solid rgba(255,255,255,0.16);
}

.right-tri {
    right: 0;
    top: 0;
    width: 0;
    height: 0;
    border-top: calc((min(92vw, 340px) * 0.72) / 2) solid transparent;
    border-bottom: calc((min(92vw, 340px) * 0.72) / 2) solid transparent;
    border-right: calc(min(92vw, 340px) * 0.5) solid rgba(0,0,0,0.06);
}

.bottom-tri {
    left: 0;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: calc(min(92vw, 340px) * 0.5) solid transparent;
    border-right: calc(min(92vw, 340px) * 0.5) solid transparent;
    border-bottom: calc((min(92vw, 340px) * 0.72) * 0.52) solid rgba(255,255,255,0.14);
    z-index: 2;
}

.flap {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 50%;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
    z-index: 4;
}

.flap::before,
.flap::after {
    content: "";
    position: absolute;
    inset: 0;
}

.flap::before {
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    background: linear-gradient(180deg, #f7a6ba 0%, #ef8ba5 100%);
    backface-visibility: hidden;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.35);
}

.flap::after {
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.03));
    transform: translateZ(1px);
    opacity: 0.9;
}

.letter {
    position: absolute;
    left: 50%;
    top: 14%;
    transform: translateX(-50%) translateY(8px);
    width: 84%;
    height: 78%;
    background: linear-gradient(180deg, #ffffff 0%, #fff9fb 100%);
    border-radius: 14px;
    z-index: 1;
    box-shadow:
        0 8px 18px rgba(0,0,0,0.14),
        inset 0 1px 0 rgba(255,255,255,0.85);
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
    padding: 20px 18px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ff4d88;
}

.letter-title {
    font-size: 20px;
    font-weight: 800;
}

.seal {
    position: absolute;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8fb0 0%, #ff4d88 55%, #e4376e 100%);
    z-index: 5;
    box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.3),
        0 8px 14px rgba(0,0,0,0.16);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 22px;
    transition: transform 0.7s ease, opacity 0.7s ease;
}

.hint {
    margin-top: 18px;
    font-size: 14px;
    color: #666;
    text-align: center;
}

.open .flap {
    transform: rotateX(180deg);
}

.open .letter {
    transform: translateX(-50%) translateY(-122px);
}

.open .seal {
    transform: translate(-50%, -50%) scale(0.88);
    opacity: 0;
}

@media (max-width: 420px) {
    .letter-title {
        font-size: 18px;
    }

    .seal {
        width: 52px;
        height: 52px;
        font-size: 20px;
    }
}
</style>
</head>

<body>
<audio id="paperSound" preload="auto">
    <source src="paper.mp3" type="audio/mpeg">
</audio>

<div class="hearts" id="hearts"></div>

<div class="stage">
    <div class="envelope" id="env" onclick="openEnvelope()">
        <div class="base"></div>
        <div class="left-tri"></div>
        <div class="right-tri"></div>
        <div class="bottom-tri"></div>

        <div class="letter">
            <div class="letter-title">For My Love</div>
        </div>

        <div class="seal">❤</div>
        <div class="flap"></div>
    </div>

    <div class="hint">Tap the envelope to open it ❤️</div>
</div>

<script>
function createHearts() {
    const hearts = document.getElementById("hearts");
    for (let i = 0; i < 14; i++) {
        const h = document.createElement("span");
        h.className = "heart-float";
        h.style.left = Math.random() * 100 + "%";
        h.style.animationDuration = (6 + Math.random() * 8) + "s";
        h.style.animationDelay = (Math.random() * 6) + "s";
        h.style.opacity = (0.15 + Math.random() * 0.35).toFixed(2);
        h.style.transform = "rotate(45deg) scale(" + (0.7 + Math.random() * 0.9).toFixed(2) + ")";
        hearts.appendChild(h);
    }
}
createHearts();

function openEnvelope() {
    const envelope = document.getElementById("env");
    if (envelope.classList.contains("open")) return;

    envelope.classList.add("pop");
    setTimeout(() => envelope.classList.remove("pop"), 400);

    envelope.classList.add("open");

    const audio = document.getElementById("paperSound");
    audio.currentTime = 0;
    audio.play().catch(() => {});

    setTimeout(function () {
        window.location.href = "letter_premium.html";
    }, 2200);
}
</script>
</body>
</html>
