<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Last Surprise ❤️</title>

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#fffaf5;
    font-family:Arial,sans-serif;
    flex-direction:column;
}

h2{
    color:#ff4d88;
    margin-bottom:25px;
}

.envelope{
    position:relative;
    width:300px;
    height:200px;
    cursor:pointer;
}

.back{
    position:absolute;
    width:100%;
    height:100%;
    background:#f8c8d2;
    border-radius:8px;
    overflow:hidden;
}

.flap{
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:110px solid #f4a9b8;
    transform-origin:top;
    transition:1s;
    z-index:3;
}

.letter{
    position:absolute;
    width:85%;
    height:160px;
    background:white;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    border-radius:8px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    color:#ff4d88;
    transition:1s;
    z-index:1;
}

.open .flap{
    transform:rotateX(180deg);
}

.open .letter{
    transform:translateX(-50%) translateY(-120px);
}

p{
    color:#666;
    margin-top:25px;
}

</style>
</head>

<body>
<audio id="paperSound">
    <source src="paper.mp3" type="audio/mpeg">
</audio>



<div class="envelope" id="env" onclick="openEnvelope()">

<div class="back"></div>

<div class="letter">
❤️ For My Love ❤️
</div>

<div class="flap"></div>

</div>

<p>Tap the envelope to open it ❤️</p>

<script>

function openEnvelope(){

const envelope = document.getElementById("env");

envelope.classList.add("open");

// Play paper opening sound
document.getElementById("paperSound").play();

// Wait for animation to finish
setTimeout(function(){

window.location.href="letter_premium.html";

},2200);

}
</script>

</body>
</html>
