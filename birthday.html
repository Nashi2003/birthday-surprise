<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Happy Birthday Love❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:#000;
}

.hero-image{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    padding:24px 22px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,0.20);
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
    width:min(86vw, 360px);
}

.message{
    text-align:center;
    color:#fff;
    font-size:clamp(24px, 5vw, 38px);
    font-weight:800;
    line-height:1.05;
}
a{
    text-decoration:none;
}

button{
    width:100%;
    border:none;
    border-radius:999px;
    padding:14px 18px;
    background:linear-gradient(135deg,#ff4d88,#ff2f73);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 18px rgba(255,77,136,0.28);
}

button:active{
    transform:scale(0.98);
}

@media (max-width:480px){
    .card{
        padding:20px 18px;
        width:min(88vw, 340px);
    }
}
</style>
</head>
<body>

<div class="hero">
    <img src="nadeemnashi.jpg" alt="Happy Birthday Love" class="hero-image">

    <div class="overlay">
        <div class="card">
           <div class="message">
  Happy Birthday<br>
  My Love🩷
</div>
            <a href="journey.html">
                <button>Journey</button>
            </a>
        </div>
    </div>
</div>

</body>
</html>
