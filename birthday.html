<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Happy Birthday Love❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#000;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
}

.hero-image{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    padding:24px;
    background:linear-gradient(
        to top,
        rgba(0,0,0,0.58) 0%,
        rgba(0,0,0,0.20) 45%,
        rgba(0,0,0,0.05) 100%
    );
}

.message{
    color:#fff;
    font-size:clamp(24px, 5vw, 38px);
    font-weight:800;
    text-align:center;
    text-shadow:0 4px 14px rgba(0,0,0,0.35);
    margin-bottom:18px;
    line-height:1.25;
}

.bouquet{
    width:min(280px, 72vw);
    display:block;
    margin-bottom:18px;
    border-radius:18px;
    box-shadow:0 10px 22px rgba(0,0,0,0.18);
}

a{
    width:min(320px, 88vw);
    text-decoration:none;
}

button{
    width:100%;
    border:none;
    border-radius:999px;
    padding:14px 18px;
    background:linear-gradient(135deg,#ff4d88,#ff2f73);
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 18px rgba(255,77,136,0.28);
}

button:active{
    transform:scale(0.98);
}

@media (max-width: 480px){
    .overlay{
        padding:18px 16px 22px;
    }

    .bouquet{
        width:min(230px, 70vw);
    }

    button{
        font-size:16px;
    }
}
</style>
</head>
<body>

<div class="hero">
    <img src="nadeemnashi.jpg" alt="Happy Birthday Love" class="hero-image">

    <div class="overlay">
        <div class="message">Happy Birthday My Love 🩷</div>

        

        <a href="journey.html">
            <button>Our Journey🤍</button>
        </a>
    </div>
</div>

</body>
</html>

    </div>
</div>

</body>
</html>
