<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Happy Birthday Love ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #fff7fb 0%, #ffe4ee 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    -webkit-text-size-adjust: 100%;
}

.container {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 28px;
    padding: 18px 18px 22px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
}

.hero-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    border-radius: 22px;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.15);
}

h1 {
    color: #ff4d88;
    font-size: 28px;
    line-height: 1.2;
    margin: 16px 0 10px;
    font-weight: 800;
}

p {
    color: #555;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 18px;
}

a {
    text-decoration: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #ff4d88, #ff2f73);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 18px rgba(255, 77, 136, 0.28);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:active {
    transform: scale(0.98);
}

button:hover {
    box-shadow: 0 12px 22px rgba(255, 77, 136, 0.34);
}

@media (min-width: 480px) {
    .container {
        padding: 20px 20px 24px;
    }

    h1 {
        font-size: 32px;
    }

    p {
        font-size: 16px;
    }

    button {
        font-size: 17px;
    }
}
</style>
</head>
<body>
    <div class="container">
        <img src="nadeemnashi.jpg" alt="Happy Birthday Love" class="hero-image">

        <h1>🎂 Happy Birthday My Love ❤️</h1>

        <p>
            May Allah bless you with happiness,<br>
            success and good health always 🤲✨
        </p>

        <a href="journey.html">
            <button>💞 Our Journey 💞</button>
        </a>
    </div>
</body>
</html>
